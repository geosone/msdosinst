[Setup]
Title=PC-DOS 7.1 Setup (Deutsch)
Product=IBM PC-DOS 7.1 Deutsch · GeosOne
Mode=DOS
Drive=C:
DefaultDir=%BOOT%\DOS
Archive=PCDOS71
License=1
License1=PC-DOS|LIZENZ.TXT
Readme=LIESMICH.TXT
Uninstall=no
Extras=yes
ExtrasDir=A:\
Fdisk=FDISK.COM
Format=FORMAT.COM %BOOT% /V:DOS /AUTOTEST
Texts=German
Done=PC-DOS 7.1 ist installiert.

[Welcome]
Willkommen zur Installation von PC-DOS 7.1 (Deutsch).

Deutsche PC-DOS-2000-Programme mit dem FAT32-Kern von PC-DOS 7.1.
Das Setup richtet bei Bedarf C: ein und installiert PC-DOS.

[Options]
Option=on|HIMEM.SYS laden
Option=on|EMM386.EXE laden (oberer Speicher, ohne EMS)| NOEMS
Option=on|Deutsche Tastatur und Ländereinstellung
Option=on|PC-DOS Shell
Option=on|REXX
Option=on|IBM-Maustreiber laden

[Dirs]
%BOOT%\TEMP

[Files]
COMMAND.COM
SYS.COM
SYS32.COM
BOOT32.BIN
FDISK32.COM
FDISK16.COM
FORMAT.COM
FORMAT16.COM
FORMAT32.COM
KEYB.COM
KEYBOARD.SYS
CHOICE.COM
FDISK.COM
LIESMICH.TXT
DOS\*
4|SHELL\*
5|REXX\*

[Run]
Before=SYS32.COM %BOOT%

[Config.sys]
Replace=yes
Add=1|DEVICE=%DIR%\HIMEM.SYS
Add=1,2|DEVICE=%DIR%\EMM386.EXE%O2%
Add=DOS=HIGH,UMB
Add=3|COUNTRY=049,850,%DIR%\COUNTRY.SYS
Add=FILES=40
Add=BUFFERS=30
Add=LASTDRIVE=Z
Add=SHELL=%DIR%\COMMAND.COM %DIR%\ /E:1024 /P

[Autoexec.bat]
Replace=yes
Add=@ECHO OFF
Add=PROMPT $P$G
Add=SET PATH=%DIR%
Add=SET TEMP=%BOOT%\TEMP
Add=3|KEYB GR,,%DIR%\KEYBOARD.SYS
Add=6|%DIR%\MOUSE.COM

[Text]
DirText=PC-DOS in dieses Verzeichnis installieren:
DirError=Bitte einen vollständigen Pfad angeben (z. B. C:\DOS).
