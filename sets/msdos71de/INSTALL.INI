; INSTALL.INI of the MS-DOS 7.1 disk set (GeosOne DOS Installer 1.1).
; Stored as UTF-8 here; mkdosset.ps1 writes it in code page 850.
[Setup]
Title=MS-DOS 7.1 Setup
Product=MS-DOS 7.1 · GeosOne
Mode=DOS
Drive=C:
DefaultDir=%BOOT%\DOS
Archive=MSDOS71
License=1,2,3,4,5
License1=Diskettensatz|LIZENZ.TXT
License2=Windows ME|EULAME.TXT
License3=Windows 98 SE|EULA98SE.TXT
License4=Windows 95|EULA95.TXT
License5=MS-DOS 6.22|EULA622.TXT
Readme=LIESMICH.TXT
Uninstall=no
Extras=yes
ExtrasDir=A:\
Fdisk=FDISK.EXE
Format=FORMAT.COM %BOOT% /V:MSDOS71
Done=MS-DOS 7.1 ist installiert.

[Welcome]
Willkommen zur Installation von MS-DOS 7.1.

Das Setup richtet bei Bedarf die Festplatte ein (FDISK, FORMAT), überträgt das System auf Laufwerk C:, kopiert die MS-DOS-Programme und legt CONFIG.SYS und AUTOEXEC.BAT an.

Danach können Sie weitere Software (Treiber, Programme) von anderen Disketten installieren.

[Options]
Option=on|HIMEM.SYS laden (Speicher über 1 MB)
Option=on|EMM386.EXE laden (oberer Speicher, ohne EMS)| NOEMS
Option=on|Deutsche Tastatur und Ländereinstellung
Option=on|MS-DOS Shell (DOSSHELL)
Option=on|Programme aus MS-DOS 5.0/6.22 (EDLIN, BACKUP, ...)
Option=on|Zusatzprogramme für Windows 95 (MEMMAKER, MSBACKUP, ...)
Option=off|AccessDOS (Eingabehilfen)
Option=off|Tastatur-Utilities (Dvorak, KBDBUF, ISO-Zeichensatz)
Option=off|Komprimierte Startdiskette (DRVBOOT)
Option=off|Netzwerkdateien von MS-DOS 6.22

[Dirs]
%BOOT%\TEMP

[Files]
; plain files of disk 1
COMMAND.COM
SYS.COM
FDISK.EXE
FORMAT.COM
KEYB.COM
KEYBOARD.SYS
KEYBRD2.SYS
LIESMICH.TXT
; archive
DOS\*
4|SUPP\SHELL\*
5|SUPP\DOS5\*
6|OLD\*
7|SUPP\ADOS\*
8|SUPP\KBD\*
9|SUPP\DRVB\*
10|SUPP\NET\*

[Run]
Before=SYS.COM %BOOT%

[Config.sys]
Replace=yes
Add=1|DEVICE=%DIR%\HIMEM.SYS /TESTMEM:OFF
Add=1,2|DEVICE=%DIR%\EMM386.EXE%O2%
Add=DOS=HIGH,UMB
Add=3|COUNTRY=049,850,%DIR%\COUNTRY.SYS
Add=FILES=40
Add=BUFFERS=30
Add=LASTDRIVE=Z
Add=SHELL=%DIR%\COMMAND.COM %DIR%\ /E:1024 /P

[Autoexec.bat]
Replace=yes
Add=@ECHO OFF
Add=PROMPT $P$G
Add=SET PATH=%DIR%
Add=SET TEMP=%BOOT%\TEMP
Add=3|KEYB GR,,%DIR%\KEYBOARD.SYS

